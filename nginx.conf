# ============================================================
# EduHub PH — Nginx Config (Security Hardened)
#
# Single virtual host on 127.0.0.1:8080.
# Cloudflare Tunnel routes public traffic here.
# No ports 80/443 need to be open on the server.
#
# Install:
#   sudo cp nginx.conf /etc/nginx/sites-available/eduhub
#   sudo ln -s /etc/nginx/sites-available/eduhub /etc/nginx/sites-enabled/eduhub
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
# ============================================================

server {
    listen 127.0.0.1:8080;
    server_name localhost;

    root  /var/www/eduhub/dist;
    index index.html;

    # ── Hide Nginx version ────────────────────────────────────
    server_tokens off;

    # ── Gzip compression ──────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types      text/plain text/css application/javascript
                    application/json image/svg+xml application/font-woff2;

    # ── Security headers ──────────────────────────────────────

    # HSTS: tell browsers to always use HTTPS for 1 year
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Prevent clickjacking
    add_header X-Frame-Options "DENY" always;

    # Prevent MIME-type sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Control referrer info sent to third parties
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Disable browser features not needed by the app
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    # Content Security Policy
    # 'unsafe-inline' on styles needed for Tailwind; AdSense requires its own domains
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://pagead2.googlesyndication.com https://partner.googleadservices.com https://www.googletagmanager.com https://adservice.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https://pagead2.googlesyndication.com; frame-src https://googleads.g.doubleclick.net https://tpc.googlesyndication.com https://www.google.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self';" always;

    # ── API — proxy to Express on :3001 ──────────────────────
    # NOTE: Helmet on the Express server already adds security headers to API
    # responses. Nginx only needs the cache directive here; the security headers
    # from the server{} block are NOT inherited because this block defines its
    # own add_header, so we repeat the essential ones explicitly.
    location /api/ {
        proxy_pass            http://127.0.0.1:3001;
        proxy_http_version    1.1;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto https;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
        proxy_connect_timeout 5s;
        client_max_body_size  2M;

        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # ── Static assets — cache forever (content-hashed by Vite) ──
    # Nginx add_header does NOT inherit from the server{} block when a location
    # defines its own add_header directives, so we repeat the security-relevant
    # headers here explicitly.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        access_log off;
    }

    # ── SPA index — never cache ───────────────────────────────
    # This block has its own add_header directives so it does NOT inherit the
    # server{} block security headers — we must repeat all of them here.
    location = /index.html {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://pagead2.googlesyndication.com https://partner.googleadservices.com https://www.googletagmanager.com https://adservice.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https://pagead2.googlesyndication.com; frame-src https://googleads.g.doubleclick.net https://tpc.googlesyndication.com https://www.google.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self';" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # ── SPA fallback ─────────────────────────────────────────
    # No add_header here — inherits all security headers from the server{} block.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Block dotfiles (.env, .git, etc.) ────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── Block common exploit probe paths ─────────────────────
    location ~* \.(php|asp|aspx|jsp)$ {
        return 404;
    }
    location ~* (wp-admin|xmlrpc\.php|\.env|\.git) {
        return 404;
    }

    access_log /var/log/nginx/eduhub.access.log;
    error_log  /var/log/nginx/eduhub.error.log warn;
}
